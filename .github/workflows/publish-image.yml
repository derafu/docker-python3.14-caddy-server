name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'config/**'
      - '.github/workflows/publish-image.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Default image: no PHP/phpy, same as before this option existed.
          - tag: latest
            phpy_enabled: 'false'
          # PHP built with --enable-embed + phpy installed, so Python code
          # in this image can host and call PHP libraries directly (e.g.
          # derafu/backbone-bridge-python and anything built on top of it).
          - tag: phpy
            phpy_enabled: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: this is what GitHub-hosted runners (and most CI
      # consumers of this image, e.g. derafu/backbone-bridge-python's own
      # workflow) actually run on. Add `linux/arm64` to `platforms` below
      # if this image ever needs to be pulled directly on an Apple Silicon
      # machine — building the `phpy` tag for arm64 means compiling PHP
      # from source under QEMU emulation, which is considerably slower
      # than this single-platform build.
      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PHPY_ENABLED=${{ matrix.phpy_enabled }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
